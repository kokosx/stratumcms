{{define "users"}}{{template "admin_head" .}}{{template "admin_topbar" .}}<div class="shell">{{template "admin_sidebar" .}}<main class="dashboard"><h1>Users</h1>{{if .Error}}<p class="notice error" role="alert">{{.Error}}</p>{{end}}<section><h2>Add user</h2><form method="post" action="/admin/users"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><div class="form-grid"><label>Email<input type="email" name="email" required></label><label>Username<input name="username" minlength="3" required></label><label>Display name<input name="display_name" required></label><label>Role<select name="role"><option value="author">Author</option><option value="editor">Editor</option><option value="administrator">Administrator</option></select></label><label>Password<input type="password" name="password" minlength="10" required></label></div><button>Create user</button></form></section><section><h2>Existing users</h2>{{range .Users}}<div class="user-card"><form method="post" action="/admin/users/{{.ID}}"><input type="hidden" name="csrf_token" value="{{$.CSRFToken}}"><div class="form-grid"><label>Email<input type="email" name="email" value="{{.Email}}" required></label><label>Username<input name="username" value="{{.Username}}" required></label><label>Display name<input name="display_name" value="{{.DisplayName}}" required></label><label>Role<select name="role"><option value="author" {{if eq .Role "author"}}selected{{end}}>Author</option><option value="editor" {{if eq .Role "editor"}}selected{{end}}>Editor</option><option value="administrator" {{if eq .Role "administrator"}}selected{{end}}>Administrator</option></select></label></div><button>Save account</button></form><form method="post" action="/admin/users/{{.ID}}/password"><input type="hidden" name="csrf_token" value="{{$.CSRFToken}}"><label>New password<input type="password" name="password" minlength="10" required></label><button>Reset password</button></form></div>{{end}}</section></main>{{template "admin_end" .}}{{end}}
