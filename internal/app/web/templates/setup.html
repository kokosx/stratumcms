{{define "setup"}}<!doctype html><html><head><meta charset="utf-8"><title>Site setup · Stratum</title><link rel="stylesheet" href="/static/app.css"></head><body class="auth"><main class="card"><h1>Site setup</h1>{{if .Error}}<p class="notice error">{{.Error}}</p>{{end}}<form method="post" action="/setup"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><label>Email<input name="email" type="email" value="{{.Email}}" required></label><label>Username<input name="username" value="{{.Username}}" required></label><label>Display name<input name="display_name" value="{{.DisplayName}}" required></label><label>Password<input name="password" type="password" required></label><label>Confirm password<input name="confirm_password" type="password" required></label><button>Create administrator</button></form></main></body></html>{{end}}
