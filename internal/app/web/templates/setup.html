{{define "setup"}}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Site setup · Stratum</title><link rel="stylesheet" href="/static/app.css"></head><body class="auth"><main class="card"><h1>Site setup</h1><p>Create the first administrator for this site.</p>{{if .Error}}<p class="notice error" role="alert">{{.Error}}</p>{{end}}<form method="post" action="/setup"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><label>Email<input name="email" type="email" autocomplete="email" value="{{.Email}}" required></label><label>Username<input name="username" autocomplete="username" minlength="3" value="{{.Username}}" required></label><label>Display name<input name="display_name" autocomplete="name" value="{{.DisplayName}}" required></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="10" required></label><label>Confirm password<input name="confirm_password" type="password" autocomplete="new-password" minlength="10" required></label><button>Create administrator</button></form></main></body></html>{{end}}
