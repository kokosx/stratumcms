{{define "login"}}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log in · Stratum</title><link rel="stylesheet" href="/static/app.css"></head><body class="auth"><main class="card"><h1>Log in to Stratum</h1>{{if .Error}}<p class="notice error" role="alert">{{.Error}}</p>{{end}}<form method="post" action="/login"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><label>Email or username<input name="login" value="{{.Login}}" autocomplete="username" required autofocus></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Log in</button></form></main></body></html>{{end}}
