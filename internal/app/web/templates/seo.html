{{define "seo"}}{{template "admin_head" .}}{{template "admin_topbar" .}}<div class="shell">{{template "admin_sidebar" .}}<main class="dashboard"><p><a href="/admin/{{.Kind}}s/{{.EntryID}}/edit">← Back to editor</a></p><h1>SEO · {{.Title}}</h1>{{if .Error}}<p class="notice error" role="alert">{{.Error}}</p>{{end}}<section><form method="post"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><input type="hidden" name="version" value="{{.Version}}"><label>Search title<input name="seo_title" maxlength="120" value="{{.SEO.Title}}" placeholder="Defaults to the entry title"></label><label>Description<textarea name="description" maxlength="320">{{.SEO.Description}}</textarea></label><label>Canonical URL<input name="canonical" type="url" value="{{.SEO.Canonical}}" placeholder="Defaults to the published path"></label><label>Robots<select name="robots"><option value="index,follow" {{if eq .SEO.Robots "index,follow"}}selected{{end}}>Index and follow</option><option value="noindex,follow" {{if eq .SEO.Robots "noindex,follow"}}selected{{end}}>No index, follow</option></select></label><button>Save SEO draft</button></form><p>SEO changes remain draft-only until the entry is published.</p></section></main>{{template "admin_end" .}}{{end}}
